name: Release

# release-please keeps a release PR open on `main`, updated on every push with
# the next version and changelog. Merging that PR creates the tag and GitHub
# release, and only then do the publish jobs below run.
#
# Publishes dagster-authkit-plus to PyPI only (no container image or Helm chart).
#
# The file name and the `release` environment are part of the PyPI trusted
# publisher configuration: do not rename either.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  pypi:
    name: Publish to PyPI
    needs: [release-please, test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
